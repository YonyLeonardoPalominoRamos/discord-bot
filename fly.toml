app = "discord-bot-vgbrha"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[deploy]
  strategy = "rolling"

[experimental]
  auto_rollback = true

# ====== AGREGAR ESTA SECCIÓN ======
[[services]]
  internal_port = 8080
  protocol = "tcp"
  
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
  
  [[services.ports]]
    port = 80
    handlers = ["http"]
  
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  
  [services.http]
    auto_stop_machines = "suspend"
    auto_start_machines = true
    min_machines_running = 0
